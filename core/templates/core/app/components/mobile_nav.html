<nav class="app-mobile-nav" aria-label="Navegación móvil">
    {% for item in navigation.mobile_items %}
        <a
            class="app-mobile-nav__item{% if item.active %} is-active{% endif %}"
            href="{{ item.url }}"
            {% if item.active %}aria-current="page"{% endif %}
        >
            {% if item.icon %}<span aria-hidden="true">{{ item.icon }}</span>{% endif %}
            <span>{{ item.short_label|default:item.label }}</span>
        </a>
    {% empty %}
        <a class="app-mobile-nav__item is-active" href="#" aria-current="page">
            <span aria-hidden="true">•</span>
            <span>Inicio</span>
        </a>
    {% endfor %}
</nav>
