<div class="app-overlay-root" id="app-overlay-root">
    <div class="app-backdrop" data-overlay-backdrop hidden></div>
    <section
        class="app-dialog"
        data-app-dialog
        role="dialog"
        aria-modal="true"
        aria-labelledby="app-dialog-title"
        hidden
    >
        <div class="app-dialog__handle" aria-hidden="true"></div>
        <header class="app-dialog__header">
            <h2 id="app-dialog-title" data-dialog-title>Acción</h2>
            <button type="button" class="app-icon-button" data-dialog-close aria-label="Cerrar">×</button>
        </header>
        <div class="app-dialog__body" data-dialog-body></div>
    </section>
</div>
