{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contrasena</title>
    <link rel="stylesheet" href="{% static 'core/css/public_auth.css' %}">
</head>
<body>
<main class="auth-page compact">
    <form class="auth-card" method="post">
        {% csrf_token %}
        <span class="eyebrow">DIRTEC</span>
        <h1>Nueva contrasena</h1>
        {% if validlink %}
            {{ form.new_password1 }}
            {{ form.new_password2 }}
            <button type="submit">Guardar contrasena</button>
        {% else %}
            <p>El enlace ya no es valido. Solicita uno nuevo.</p>
            <a class="button-link" href="{% url 'password_reset' %}">Solicitar enlace</a>
        {% endif %}
    </form>
</main>
</body>
</html>
