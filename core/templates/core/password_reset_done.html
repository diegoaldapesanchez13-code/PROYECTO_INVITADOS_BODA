{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex,nofollow">
    <title>Revisa tu correo | DIRTEC Event Studio</title>
    <link rel="stylesheet" href="{% static 'core/app/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'core/app/auth.css' %}">
</head>
<body class="auth-body auth-body--compact">
<main class="auth-centered">
    <section class="auth-card auth-card--compact">
        <div class="auth-centered__brand">
            <div class="auth-product-mark" aria-hidden="true">D</div>
            <div>
                <span class="auth-kicker">DIRTEC</span>
                <strong>Event Studio</strong>
            </div>
        </div>

        <div class="auth-status-icon auth-status-icon--success" aria-hidden="true">✓</div>

        <div class="auth-card__header auth-card__header--center">
            <span class="auth-kicker">Solicitud recibida</span>
            <h1>Revisa tu correo</h1>
            <p>
                Si existe una cuenta asociada al correo indicado, recibirás las
                instrucciones para restablecer tu contraseña.
            </p>
        </div>

        <a class="auth-submit auth-submit--link" href="{% url 'login' %}">Volver a iniciar sesión</a>
    </section>
</main>
</body>
</html>
