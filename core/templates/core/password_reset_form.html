{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acceso</title>
    <link rel="stylesheet" href="{% static 'core/css/public_auth.css' %}">
</head>
<body>
<main class="auth-page compact">
    <form class="auth-card" method="post">
        {% csrf_token %}
        <span class="eyebrow">DIRTEC</span>
        <h1>Recuperar contrasena</h1>
        <p>Escribe el correo asociado a tu usuario. Si existe una cuenta, enviaremos instrucciones.</p>
        {{ form.email }}
        <button type="submit">Enviar instrucciones</button>
        <a class="plain-link" href="{% url 'login' %}">Volver al login</a>
    </form>
</main>
</body>
</html>
