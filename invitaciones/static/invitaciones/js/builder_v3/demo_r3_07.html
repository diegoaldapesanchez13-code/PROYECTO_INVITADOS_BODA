
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        R3.07 Asset Studio Core
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Parisienne&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&family=Sacramento&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="./renderer/renderer.css"
    >

    <link
        rel="stylesheet"
        href="./canvas/canvas.css"
    >

    <link
        rel="stylesheet"
        href="./inspector/inspector.css"
    >

    <link
        rel="stylesheet"
        href="./assets/library.css"
    >

    <link
        rel="stylesheet"
        href="./layers/layer_tree.css"
    >

    <link
        rel="stylesheet"
        href="./components/library.css"
    >

    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #e9e5dc;
            color: #252922;
            font-family: Arial, sans-serif;
        }

        .demo-shell {
            display: grid;
            gap: 12px;
            max-width: 1720px;
            margin: 0 auto;
        }

        .demo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .demo-header h1 {
            margin: 0;
            font-size: 1.15rem;
        }

        .demo-left-sidebar {
            display: grid;
            grid-template-rows:
                auto
                minmax(0, 1fr);
            gap: 8px;
            min-height: 0;
        }

        .demo-left-tabs {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .demo-left-tabs button {
            padding: 9px 10px;
            border: 1px solid #d0cbc1;
            border-radius: 9px;
            background: #f8f6f1;
            color: #3d423a;
            cursor: pointer;
            font-weight: 800;
        }

        .demo-left-tabs button.is-active {
            border-color: #526043;
            background: #526043;
            color: #fff;
        }

        .demo-left-panel {
            min-height: 0;
        }

        .demo-left-panel[hidden] {
            display: none;
        }

        .demo-workspace {
            display: grid;
            grid-template-columns:
                270px
                minmax(0, 1fr)
                330px;
            gap: 12px;
            min-height: 760px;
        }

        .r3-canvas-viewport {
            min-height: 760px;
        }

        .r3-canvas-zoom-layer,
        .r3-canvas-surface,
        .r3-canvas-overlay-layer {
            width: 390px;
            min-height: 0;
        }

        .r3-canvas-surface {
            border-radius: 28px;
        }

        @media (max-width: 1180px) {
            .demo-workspace {
                grid-template-columns:
                    240px
                    minmax(0, 1fr);
            }

            [data-r3-inspector] {
                grid-column: 1 / -1;
                max-height: 620px;
            }
        }

        @media (max-width: 760px) {
            .demo-workspace {
                grid-template-columns: 1fr;
            }

            [data-r3-library],
            [data-r3-inspector] {
                max-height: 520px;
            }
        }
    </style>
</head>

<body>
    <main class="demo-shell">
        <header class="demo-header">
            <div>
                <h1>
                    R3.07 · Asset Studio Core
                </h1>

                <div
                    class="r3-canvas-status"
                    data-r3-status
                >
                    Design Studio listo
                </div>
            </div>

            <div class="r3-canvas-toolbar">
                <div class="r3-canvas-toolbar__group">
                    <button
                        type="button"
                        data-r3-zoom="0.5"
                    >
                        50%
                    </button>

                    <button
                        type="button"
                        data-r3-zoom="0.75"
                    >
                        75%
                    </button>

                    <button
                        type="button"
                        data-r3-zoom="1"
                    >
                        100%
                    </button>

                    <button
                        type="button"
                        data-r3-zoom="fit"
                    >
                        Ajustar
                    </button>
                </div>

                <div class="r3-canvas-toolbar__group">
                    <button
                        type="button"
                        data-r3-undo
                    >
                        Deshacer
                    </button>

                    <button
                        type="button"
                        data-r3-redo
                    >
                        Rehacer
                    </button>

                    <button
                        type="button"
                        data-r3-reset-document
                    >
                        Restablecer demo
                    </button>
                </div>
            </div>
        </header>

        <div class="demo-workspace">
            <aside class="demo-left-sidebar">
                <nav class="demo-left-tabs">
                    <button
                        type="button"
                        class="is-active"
                        data-r3-left-tab="assets"
                    >
                        Assets
                    </button>

                    <button
                        type="button"
                        data-r3-left-tab="components"
                    >
                        Componentes
                    </button>

                    <button
                        type="button"
                        data-r3-left-tab="layers"
                    >
                        Capas
                    </button>

                    <button
                        type="button"
                        data-r3-left-tab="canvases"
                    >
                        Lienzos
                    </button>
                </nav>

                <div
                    class="demo-left-panel"
                    data-r3-left-panel="assets"
                    data-r3-library
                ></div>

                <div
                    class="demo-left-panel"
                    data-r3-left-panel="components"
                    data-r3-components
                    hidden
                ></div>

                <div
                    class="demo-left-panel"
                    data-r3-left-panel="layers"
                    data-r3-layers
                    hidden
                ></div>

                <div
                    class="demo-left-panel"
                    data-r3-left-panel="canvases"
                    data-r3-canvases
                    hidden
                ></div>
            </aside>

            <div
                class="r3-canvas-viewport"
                data-r3-canvas-viewport
            >
                <div
                    class="r3-canvas-zoom-layer"
                    data-r3-canvas-zoom-layer
                >
                    <div
                        class="r3-canvas-surface"
                        data-r3-canvas-surface
                    ></div>

                    <div
                        class="r3-canvas-overlay-layer"
                        data-r3-canvas-overlay-layer
                    ></div>
                </div>
            </div>

            <aside data-r3-inspector></aside>
        </div>
    </main>

    <script
        type="module"
        src="./demo_r3_07.js"
    ></script>
</body>
</html>
