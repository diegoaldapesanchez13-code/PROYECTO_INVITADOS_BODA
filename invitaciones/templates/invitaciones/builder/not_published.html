{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitación no publicada</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f1ea;
            color: #30362f;
            font-family: Inter, system-ui, sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: 38px 28px;
            border: 1px solid #d9d4c9;
            border-radius: 24px;
            background: #fff;
            text-align: center;
            box-shadow: 0 20px 60px rgba(30, 38, 30, .08);
        }
        h1 { margin: 0 0 12px; font-size: 1.55rem; }
        p { margin: 0; line-height: 1.6; color: #667064; }
    </style>
</head>
<body>
    <main>
        <h1>Invitación aún no publicada</h1>
        <p>El diseño de esta invitación todavía no está disponible.</p>
    </main>
</body>
</html>
