                <form class="mini-admin-form" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="accion" value="agregar_itinerario">
                    <input type="hidden" name="evento_id" value="{{ evento.id }}">
                    <h3>Itinerario</h3>
                    <div class="design-grid">
                        <label>
                            Hora
                            <input type="time" name="hora_itinerario">
                        </label>
                        <label>
                            Título
                            <input type="text" name="titulo_itinerario" placeholder="Ceremonia, recepción...">
                        </label>
                        <label>
                            Orden
                            <input type="number" name="orden_itinerario" min="0" value="0">
                        </label>
                        <label class="wide">
                            Descripción
                            <input type="text" name="descripcion_itinerario" placeholder="Lugar o detalle corto">
                        </label>
                    </div>
                    <div class="actions form-actions">
                        <button class="btn" type="submit">Agregar itinerario</button>
                    </div>
                </form>
