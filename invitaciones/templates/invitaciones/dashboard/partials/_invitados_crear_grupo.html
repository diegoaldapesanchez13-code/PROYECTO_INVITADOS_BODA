            <form class="mini-admin-form" method="post">
                {% csrf_token %}
                <input type="hidden" name="accion" value="agregar_grupo">
                <input type="hidden" name="evento_id" value="{{ evento.id }}">
                <h3>Crear invitación</h3>
                <div class="design-grid">
                    <label>
                        Tipo
                        <select name="tipo_grupo">
                            {% for valor, texto in tipos_invitacion %}
                                <option value="{{ valor }}">{{ texto }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label>Nombre o familia<input type="text" name="nombre_grupo" placeholder="Carlos Ramírez o Familia Pérez"></label>
                    <label>Teléfono<input type="text" name="telefono_contacto" placeholder="WhatsApp"></label>
                    <label>Correo<input type="text" name="correo_contacto" placeholder="correo@ejemplo.com"></label>
                    <label>Mesa<input type="text" name="mesa" placeholder="Mesa 4"></label>
                    <label>Acompañantes permitidos<input type="number" name="cantidad_extra_permitida" min="0" value="0"></label>
                    <label>Cupo familiar estimado<input type="number" name="cantidad_maxima" min="1" value="1"></label>
                    <label class="wide">
                        Integrantes familiares
                        <textarea name="invitados_familia" placeholder="Un invitado por línea. Ejemplo: Ana Pérez | Adulto&#10;Sofía Pérez | Niño"></textarea>
                    </label>
                </div>
                <div class="actions form-actions">
                    <button class="btn" type="submit">Crear invitación</button>
                </div>
            </form>
