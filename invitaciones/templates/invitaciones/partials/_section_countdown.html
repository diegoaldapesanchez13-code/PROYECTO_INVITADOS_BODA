{% if secciones.CUENTA_REGRESIVA.activa %}
<section class="section" id="cuenta" data-invitation-section="CUENTA_REGRESIVA"
    style="order: {{ secciones.CUENTA_REGRESIVA.orden }}; {{ secciones.CUENTA_REGRESIVA.estilo_editor }}">
    <div class="panel countdown-panel universal-section-panel section-header-panel
        {% if secciones.CUENTA_REGRESIVA.imagen_titulo %}has-section-header-media{% endif %}
        {% if secciones.CUENTA_REGRESIVA.fondo %}bg-panel{% endif %}
        {% if secciones.CUENTA_REGRESIVA.fondo_es_video %}bg-video-panel{% endif %}"
        {% if secciones.CUENTA_REGRESIVA.fondo and not secciones.CUENTA_REGRESIVA.fondo_es_video %}
            style="background-image: url('{{ secciones.CUENTA_REGRESIVA.fondo.url }}'); background-position: {{ secciones.CUENTA_REGRESIVA.posicion_fondo }};"
        {% endif %}>
        {% include "invitaciones/partials/_section_base.html" with seccion=secciones.CUENTA_REGRESIVA titulo_default="Cuenta regresiva" texto_alt="Portada de cuenta regresiva" media_class="countdown-full-image" %}
        <div class="section-main-content countdown-interactive-layer universal-layout-content flow-content" data-native-element data-element-id="countdown-content"
            data-element-type="container" data-element-role="countdown-content"
            data-element-section="CUENTA_REGRESIVA">
            <span class="editor-countdown-resize-handle" aria-hidden="true"></span>
            <div class="count-grid universal-layout-grid" data-native-element data-element-id="countdown-grid"
                data-element-type="container" data-element-role="countdown-grid"
                data-element-section="CUENTA_REGRESIVA">
                <div class="count-box" data-native-element data-element-id="countdown-days"
                    data-element-type="counter" data-element-role="countdown-days"
                    data-element-section="CUENTA_REGRESIVA"><strong id="dias">0</strong><span>Días</span></div>
                <div class="count-box" data-native-element data-element-id="countdown-hours"
                    data-element-type="counter" data-element-role="countdown-hours"
                    data-element-section="CUENTA_REGRESIVA"><strong id="horas">0</strong><span>Horas</span></div>
                <div class="count-box" data-native-element data-element-id="countdown-minutes"
                    data-element-type="counter" data-element-role="countdown-minutes"
                    data-element-section="CUENTA_REGRESIVA"><strong id="minutos">0</strong><span>Minutos</span></div>
                <div class="count-box" data-native-element data-element-id="countdown-seconds"
                    data-element-type="counter" data-element-role="countdown-seconds"
                    data-element-section="CUENTA_REGRESIVA"><strong id="segundos">0</strong><span>Segundos</span></div>
            </div>
        </div>
    </div>
</section>
{% endif %}
